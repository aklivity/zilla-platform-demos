    content: |
      import json, logging, os, signal, time, uuid
      from confluent_kafka import Consumer, KafkaError, KafkaException
      from openai import OpenAI
      from qdrant_client import QdrantClient
      from qdrant_client.http.models import Distance, PointStruct, VectorParams

      logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)-8s %(name)s %(message)s")
      log = logging.getLogger("embedder")

      KAFKA_BOOTSTRAP    = os.environ["KAFKA_BOOTSTRAP"]
      KAFKA_SASL_USER    = os.getenv("KAFKA_SASL_USERNAME", "")
      KAFKA_SASL_PASS    = os.getenv("KAFKA_SASL_PASSWORD", "")
      KAFKA_GROUP_ID     = os.getenv("KAFKA_GROUP_ID", "embedder-service")
      KAFKA_TOPIC_CHUNKS = os.getenv("KAFKA_TOPIC_CHUNKS", "rag.chunks")
      OPENAI_API_KEY     = os.environ["OPENAI_API_KEY"]
      EMBEDDING_MODEL    = os.getenv("EMBEDDING_MODEL", "text-embedding-3-small")
      EMBEDDING_DIMS     = int(os.getenv("EMBEDDING_DIMS", "1536"))
      QDRANT_URL         = os.getenv("QDRANT_URL", "http://localhost:6333")
      QDRANT_COLLECTION  = os.getenv("QDRANT_COLLECTION", "rag_chunks")
      BATCH_SIZE         = int(os.getenv("EMBED_BATCH_SIZE", "16"))

      openai_client = OpenAI(api_key=OPENAI_API_KEY)
      qdrant = QdrantClient(url=QDRANT_URL)

      kafka_cfg = {
          "bootstrap.servers": KAFKA_BOOTSTRAP,
          "group.id": KAFKA_GROUP_ID,
          "auto.offset.reset": os.getenv("KAFKA_AUTO_OFFSET", "earliest"),
          "enable.auto.commit": False,
      }
      if KAFKA_SASL_USER:
          kafka_cfg.update({"security.protocol":"SASL_PLAINTEXT","sasl.mechanism":"PLAIN",
                            "sasl.username":KAFKA_SASL_USER,"sasl.password":KAFKA_SASL_PASS})
      consumer = Consumer(kafka_cfg)

      def ensure_collection():
          existing = {c.name for c in qdrant.get_collections().collections}
          if QDRANT_COLLECTION not in existing:
              qdrant.create_collection(QDRANT_COLLECTION,
                  vectors_config=VectorParams(size=EMBEDDING_DIMS, distance=Distance.COSINE))
              log.info("Created Qdrant collection '%s'", QDRANT_COLLECTION)

      def embed(texts):
          return [i.embedding for i in openai_client.embeddings.create(model=EMBEDDING_MODEL, input=texts).data]

      def upsert(chunks, vectors):
          points = [PointStruct(
              id=str(uuid.uuid5(uuid.NAMESPACE_URL, f"{c['doc_id']}#{c['chunk_index']}")),
              vector=v,
              payload={k: c.get(k,"") for k in ("doc_id","chunk_index","text","source_url","visibility")}
          ) for c, v in zip(chunks, vectors)]
          qdrant.upsert(collection_name=QDRANT_COLLECTION, points=points, wait=True)
          log.info("Upserted %d points", len(points))

      def flush(pending):
          for attempt in range(3):
              try:
                  upsert(pending, embed([c["text"] for c in pending]))
                  consumer.commit(asynchronous=False)
                  return
              except Exception as e:
                  log.warning("Flush attempt %d failed: %s", attempt+1, e)
                  time.sleep(2 ** (attempt+1))
          log.error("Giving up on batch of %d", len(pending))

      running = True
      def stop(*_): global running; running = False
      signal.signal(signal.SIGTERM, stop)
      signal.signal(signal.SIGINT, stop)

      ensure_collection()
      consumer.subscribe([KAFKA_TOPIC_CHUNKS])
      log.info("Subscribed to '%s'", KAFKA_TOPIC_CHUNKS)
      pending = []
      try:
          while running:
              msg = consumer.poll(timeout=1.0)
              if msg is None:
                  if pending: flush(pending); pending = []
                  continue
              if msg.error():
                  if msg.error().code() != KafkaError._PARTITION_EOF: raise KafkaException(msg.error())
                  continue
              try:
                  c = json.loads(msg.value()); c.setdefault("visibility","internal"); pending.append(c)
              except Exception as e:
                  log.warning("Skipping bad message: %s", e); consumer.commit(message=msg); continue
              if len(pending) >= BATCH_SIZE: flush(pending); pending = []
      finally:
          if pending: flush(pending)
          consumer.close()

  rag_chain.py:
    content: |
      import json, logging, os, signal, time
      from concurrent.futures import ThreadPoolExecutor, as_completed
      from confluent_kafka import Consumer, KafkaError, KafkaException, Producer
      from openai import OpenAI
      from qdrant_client import QdrantClient
      from qdrant_client.http.models import Filter, FieldCondition, MatchAny

      logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)-8s %(name)s %(message)s")
      log = logging.getLogger("rag-chain")

      KAFKA_BOOTSTRAP   = os.environ["KAFKA_BOOTSTRAP"]
      KAFKA_SASL_USER   = os.getenv("KAFKA_SASL_USERNAME", "")
      KAFKA_SASL_PASS   = os.getenv("KAFKA_SASL_PASSWORD", "")
      TOPIC_QUERIES     = os.getenv("KAFKA_TOPIC_QUERIES", "rag.queries")
      TOPIC_RESULTS     = os.getenv("KAFKA_TOPIC_RESULTS", "rag.results")
      OPENAI_API_KEY    = os.environ["OPENAI_API_KEY"]
      EMBEDDING_MODEL   = os.getenv("EMBEDDING_MODEL", "text-embedding-3-small")
      LLM_MODEL         = os.getenv("LLM_MODEL", "gpt-4o-mini")
      LLM_TEMPERATURE   = float(os.getenv("LLM_TEMPERATURE", "0.2"))
      LLM_MAX_TOKENS    = int(os.getenv("LLM_MAX_TOKENS", "1024"))
      QDRANT_URL        = os.getenv("QDRANT_URL", "http://localhost:6333")
      QDRANT_COLLECTION = os.getenv("QDRANT_COLLECTION", "rag_chunks")
      DEFAULT_TOP_K     = int(os.getenv("DEFAULT_TOP_K", "5"))
      SCORE_THRESHOLD   = float(os.getenv("SCORE_THRESHOLD", "0.35"))
      WORKER_THREADS    = int(os.getenv("WORKER_THREADS", "4"))

      ROLE_VIS = {"enterprise":["public","internal","confidential"],"standard":["public","internal"],"free":["public"]}
      def allowed_vis(roles):
          s = set()
          for r in roles: s.update(ROLE_VIS.get(r,["public"]))
          return list(s) or ["public"]

      def sys_prompt(uid, roles):
          tier = "enterprise" if "enterprise" in roles else ("standard" if "standard" in roles else "free")
          base = "Answer using only the provided context. Cite doc_id sources. Be concise."
          return f"{base}\nAssisting '{uid}' (tier: {tier})." if uid != "anonymous" else base

      openai_client = OpenAI(api_key=OPENAI_API_KEY)
      qdrant = QdrantClient(url=QDRANT_URL)

      kafka_cfg = {"bootstrap.servers":KAFKA_BOOTSTRAP,"group.id":os.getenv("KAFKA_GROUP_ID","rag-chain-service"),
                   "auto.offset.reset":os.getenv("KAFKA_AUTO_OFFSET","earliest"),"enable.auto.commit":False}
      prod_cfg  = {"bootstrap.servers":KAFKA_BOOTSTRAP,"acks":"all","enable.idempotence":True}
      if KAFKA_SASL_USER:
          sasl = {"security.protocol":"SASL_PLAINTEXT","sasl.mechanism":"PLAIN",
                  "sasl.username":KAFKA_SASL_USER,"sasl.password":KAFKA_SASL_PASS}
          kafka_cfg.update(sasl); prod_cfg.update(sasl)
      consumer = Consumer(kafka_cfg)
      producer = Producer(prod_cfg)

      def process(msg):
          t0 = time.monotonic()
          payload  = json.loads(msg.value())
          qid      = payload.get("query_id") or (msg.key().decode() if msg.key() else "unknown")
          question = payload["question"]
          top_k    = payload.get("top_k", DEFAULT_TOP_K)
          # tier comes from the request payload — client includes their JWT roles claim
          hdrs      = {k: v.decode() for k, v in (msg.headers() or [])}
          user_tier = hdrs.get("user-tier", "free")
          uid       = payload.get("user_id", "anonymous")
          roles     = [user_tier]
          vis       = allowed_vis(roles)
          log.info("query_id=%s user=%s roles=%s vis=%s", qid, uid, roles, vis)
          try:
              qvec = openai_client.embeddings.create(model=EMBEDDING_MODEL, input=question).data[0].embedding
              hits = qdrant.search(collection_name=QDRANT_COLLECTION, query_vector=qvec,
                  query_filter=Filter(must=[FieldCondition(key="visibility",match=MatchAny(any=vis))]),
                  limit=top_k, score_threshold=SCORE_THRESHOLD, with_payload=True)
              sources = [{"doc_id":h.payload.get("doc_id",""),"chunk_index":h.payload.get("chunk_index",0),
                          "source_url":h.payload.get("source_url",""),"score":round(h.score,4)} for h in hits]
              ctx = "\n\n---\n\n".join(
                  f"[Source: {h.payload.get('doc_id')}, chunk {h.payload.get('chunk_index')}]\n{h.payload.get('text','')}"
                  for h in hits) if hits else ""
              if not ctx:
                  answer, usage = "No relevant information found for your access level.", {}
              else:
                  r = openai_client.chat.completions.create(model=LLM_MODEL, temperature=LLM_TEMPERATURE,
                      max_tokens=LLM_MAX_TOKENS,
                      messages=[{"role":"system","content":sys_prompt(uid,roles)},
                                {"role":"user","content":f"Context:\n{ctx}\n\nQuestion: {question}"}])
                  answer = r.choices[0].message.content.strip()
                  usage  = {"prompt_tokens":r.usage.prompt_tokens,"completion_tokens":r.usage.completion_tokens,
                            "total_tokens":r.usage.total_tokens}
              ms = int((time.monotonic()-t0)*1000)
              result = {"query_id":qid,"answer":answer,"sources":sources,"model":LLM_MODEL,"latency_ms":ms,
                        "user_id":uid,"user_tier":"enterprise" if "enterprise" in roles else ("standard" if "standard" in roles else "free"),
                        "token_usage":usage}
          except Exception as e:
              ms = int((time.monotonic()-t0)*1000)
              result = {"query_id":qid,"answer":f"Error: {e}","sources":[],"model":LLM_MODEL,"latency_ms":ms,
                        "user_id":uid,"user_tier":"unknown","token_usage":{},"error":str(e)}
              log.exception("Failed query_id=%s", qid)
          producer.produce(
              topic=TOPIC_RESULTS,
              key=qid.encode(),
              value=json.dumps(result).encode(),
              headers={"tier": user_tier})
          producer.poll(0)
          log.info("Answered query_id=%s in %dms", qid, result["latency_ms"])

      running = True
      def stop(*_): global running; running = False
      signal.signal(signal.SIGTERM, stop)
      signal.signal(signal.SIGINT, stop)

      consumer.subscribe([TOPIC_QUERIES])
      log.info("Subscribed to '%s'", TOPIC_QUERIES)
      with ThreadPoolExecutor(max_workers=WORKER_THREADS, thread_name_prefix="rag") as pool:
          futures = {}
          try:
              while running:
                  msg = consumer.poll(timeout=1.0)
                  for f in [f for f in list(futures) if f.done()]:
                      orig = futures.pop(f)
                      try: f.result()
                      except Exception as e: log.error("Worker error: %s", e)
                      consumer.commit(message=orig)
                  if msg is None: continue
                  if msg.error():
                      if msg.error().code() != KafkaError._PARTITION_EOF: raise KafkaException(msg.error())
                      continue
                  try: json.loads(msg.value())
                  except Exception: consumer.commit(message=msg); continue
                  futures[pool.submit(process, msg)] = msg
          finally:
              for f in as_completed(futures):
                  try: f.result()
                  except Exception as e: log.error("Shutdown error: %s", e)
              producer.flush(10)
              consumer.close()